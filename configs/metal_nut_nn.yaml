model:
  type: "nn_resnet"
  max_patches: 15000

paths:
  reference_dir: "data/raw/metal_nut/train/good"
  reference_cache: "data/cache/metal_nut_nn_bank.npz"
  input_dir: "data/raw/metal_nut/test/scratch"
  output_dir: "results/metal_nut_nn"
  report_csv: "results/metal_nut_nn/report.csv"
  test_root_dir: "data/raw/metal_nut/test"
  ground_truth_dir: "data/raw/metal_nut/ground_truth"

preprocessing:
  blur_kernel_size: 9
  bg_mode: "auto"
  use_clahe: true
  target_size: [224, 224]

inspection:
  anomaly_threshold: 0.76
  min_defect_area_px: 120
  morph_kernel_size: 5